# Builds the Itàn desktop apps and attaches them to a GitHub Release.
# Runs when the release branch is updated, when a version tag like v1.0.1 is pushed,
# or by hand from the Actions tab. The version comes from src-tauri/tauri.conf.json.
name: Desktop apps

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Itàn v__VERSION__'
          releaseBody: |
            Download Itàn for your computer:
            - **Windows:** the `.msi` or `-setup.exe` file. If Windows shows "Windows protected your PC", click **More info → Run anyway**.
            - **Mac (Apple silicon and Intel):** the `.dmg` file. Open it and drag Itàn to Applications. The first time, right-click Itàn → **Open**, or go to System Settings → Privacy & Security → **Open Anyway**.
            - **Linux:** the `.AppImage`, `.deb` or `.rpm` file.

            Phones: open the web app and tap **Get the app**.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
