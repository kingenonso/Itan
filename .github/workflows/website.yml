# Publishes the web app to GitHub Pages (kingenonso.github.io/Itan) whenever main changes.
# It packs the scripts first, so the website always matches the code.
# One-time setting: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build:web
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html dev.html sw.js manifest.json css js icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
