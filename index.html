<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Itàn</title>
<meta name="description" content="Itàn: free visual boards for notes, pictures, videos and plans. Saved on your own device.">
<meta name="theme-color" content="#1c1d20">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("itan:theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/film.css">
</head>
<body>
<div id="app">
  <main id="stage">
    <div id="canvas"><div id="world"><svg id="links"></svg></div></div>
    <div id="empty"><b>A blank board</b>Pick something from the dock, double-click anywhere, or paste a link, text, picture or video.</div>
    <div id="ctx" hidden></div>
    <div id="mode" hidden></div>
    <aside id="drawer" hidden>
      <header><div>All boards<small id="tcount"></small></div><button class="ib" id="tClose" aria-label="Close">✕</button></header>
      <div id="tree"></div>
      <footer><span id="where"></span><br><button class="ib" id="bStore">Storage on this device</button></footer>
    </aside>
  </main>
  <header id="top">
    <div class="island" id="nav"><button class="mark" id="homeMark" title="Go to Home" aria-label="Go to Home"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="itan-bg-nav" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4bff"/><stop offset="1" stop-color="#3424d6"/></linearGradient>
    <radialGradient id="itan-gl-nav" cx=".28" cy=".18" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="itan-bar-nav"><rect x="-88" y="-25" width="176" height="50" rx="25"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#itan-bg-nav)"/>
  <rect width="512" height="512" rx="116" fill="url(#itan-gl-nav)"/>
  <g fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round"><circle cx="240" cy="318" r="86"/><path d="M326 246 V397"/></g>
  <g transform="translate(232 146) rotate(26)">
    <rect x="-88" y="-25" width="176" height="50" rx="25" fill="#ffbd2e"/>
    <g clip-path="url(#itan-bar-nav)" stroke="#fff" stroke-opacity=".55" stroke-width="14"><path d="M-30 -40 L-52 40 M14 -40 L-8 40 M58 -40 L36 40"/></g>
    <circle cx="-60" cy="0" r="9" fill="#3424d6"/>
  </g>
</svg></button><div id="crumbs"></div></div>
    <div id="explain"></div>
    <div id="btools"></div>
    <span class="spacer"></span>
    <div class="island">
      <button class="ib" id="bToday" title="Today: everything left to do (T)"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16M9 3.5v4M15 3.5v4M8.5 14.5l2 2 4-4"/></svg><span class="hide-s">Today</span><span class="badge" hidden></span></button>
      <button class="ib" id="bSearch" title="Search all boards (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span class="hide-s">Search</span></button>
      <button class="ib" id="bTree" title="All boards"><svg viewBox="0 0 24 24"><path d="M5 5h6v6H5zM13 13h6v6h-6zM8 11v5h5"/></svg><span id="count" class="hide-s"></span></button>
      <button class="ib" id="bShare" title="Send a board to someone, or open one"><svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg><span class="hide-s">Share</span></button>
    </div>
  </header>
  <div class="island" id="zoom"><span id="status"></span><button class="ib" id="zo" aria-label="Zoom out">−</button><button class="ib" id="zl" title="Fit everything on screen">100%</button><button class="ib" id="zi" aria-label="Zoom in">+</button></div>
  <nav id="tb" aria-label="Add to board"></nav>
</div>
<div id="ring" hidden></div>
<div class="ov" id="search" hidden><div class="panel"><input id="sq" placeholder="Search every board" autocomplete="off" aria-label="Search"><div id="sr"></div></div></div>
<div class="ov" id="dlg" hidden><div class="panel" id="dlgp"></div></div>
<div id="toast" hidden></div>
<div id="load"><div class="mark"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="itan-bg-load" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4bff"/><stop offset="1" stop-color="#3424d6"/></linearGradient>
    <radialGradient id="itan-gl-load" cx=".28" cy=".18" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="itan-bar-load"><rect x="-88" y="-25" width="176" height="50" rx="25"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#itan-bg-load)"/>
  <rect width="512" height="512" rx="116" fill="url(#itan-gl-load)"/>
  <g fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round"><circle cx="240" cy="318" r="86"/><path d="M326 246 V397"/></g>
  <g transform="translate(232 146) rotate(26)">
    <rect x="-88" y="-25" width="176" height="50" rx="25" fill="#ffbd2e"/>
    <g clip-path="url(#itan-bar-load)" stroke="#fff" stroke-opacity=".55" stroke-width="14"><path d="M-30 -40 L-52 40 M14 -40 L-8 40 M58 -40 L36 40"/></g>
    <circle cx="-60" cy="0" r="9" fill="#3424d6"/>
  </g>
</svg></div></div>
<input type="file" id="file" accept="image/*,video/*,audio/*" multiple hidden>
<input type="file" id="boardFile" accept=".board" hidden>
<script src="js/config.js"></script>
<script src="js/storage-local.js"></script>
<script src="js/app.js"></script>
<script src="js/features/core.js"></script>
<script src="js/features/today.js"></script>
<script src="js/features/share.js"></script>
<script src="js/features/walk.js"></script>
<script src="js/features/transcribe.js"></script>
<script src="js/features/history.js"></script>
<script src="js/features/lock.js"></script>
<script src="js/features/tidy.js"></script>
<script src="js/features/templates.js"></script>
<script src="js/features/export.js"></script>
<script src="js/features/install.js"></script>
<script src="js/features/film-core.js"></script>
<script src="js/features/film-breakdown.js"></script>
<script src="js/features/film-script.js"></script>
<script src="js/features/film-lined.js"></script>
<script src="js/features/film-smart.js"></script>
<script src="js/features/film-schedule.js"></script>
<script src="js/features/film-shots.js"></script>
<script src="js/features/film-callsheet.js"></script>
<script src="js/features/film-review.js"></script>
<script src="js/features/film-budget.js"></script>
<script src="js/features/film-reports.js"></script>
<script src="js/features/live.js"></script>
<script src="js/features/film-sketch.js"></script>
<script src="js/features/film-animatic.js"></script>
<script src="js/features/film-shotlist.js"></script>
<script src="js/features/film-sun.js"></script>
<script src="js/features/film-camera.js"></script>
<script src="js/features/film-takes.js"></script>
<script src="js/features/film-set.js"></script>
<script src="js/features/film-post.js"></script>
<script src="js/features/comments.js"></script>
<script src="js/features/guest.js"></script>
<script src="js/features/film-casting.js"></script>
<script src="js/features/welcome.js"></script>
<script src="js/features/backup.js"></script>
<script>
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
